<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="run_inventory.css"/>
  </head>

<body>
  <button id="open-viewer-page-btn">Test Results Viewer</button>
  <h1>Game Dev Assets Inventory Test</h1>
  <div id="select-page-wrapper">
    <label for="select-page">Select Page:</label>
    <select id="select-page"></select> <button id="go-page-button">Go</button>
  </div>
  <div id="error-content" class="hidden">
    <p>Can't get inventory from this page.</p><p>Try a different page.</p>
  </div>
  <div id="found-inventory" class="hidden">
    <div id="which-site"></div>
    <button id="start-gathering-inventory-btn">Start Inventory Tests</button>
  </div>
  <div id="progress" class="hidden">
    <p id="progress-text">Running tests...</p>
    <progress id="progress-bar" value="0" max="100"></progress>
    <button id="reset">Reset</button>
  </div>
  <script src="run_inventory.js"></script>
</body>

</html>
